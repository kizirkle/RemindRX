<!-- Create account page -->
<!DOCTYPE html>
<html>
    <head>
        <title>Create Account</title>
        <link rel="stylesheet" href="index.css">
        <link rel="fav icon" type="image/x-icon" href="image/pill.png">

    </head>
    <div id="logo-container">
        <img src="image/remindrx_logo.svg" alt="RemindRx Logo" id="brand-logo">
    </div>
    <body>
        
        <div class="login" id="create-account-form">
        <h1>Create <b>Account</b></h1>
        <!-- Create account form -->
        <form class="login">
            <!-- Choose patient or provider radio button -->
            <div>
                <input type="radio" value="healthcare-provider" name="choice" id="radio-provider" required> 
                <label class="option" >Healthcare Provider</label>
            </div>
            <div>
                <input type="radio" value="patient" name="choice" id="radio-patient"> 
                <label class="option" >Patient</label>
            </div>

            <!-- Get first name, last name, phone number, email, passwor, and confirmed password from user -->
            <input id="first-name" placeholder="First Name" required>
            <input id="last-name" placeholder="Last Name" required>
            <input type="tel" id="phone-number" placeholder="Phone Number" required>
            <input type="email" id="email" placeholder="Email" required>
            <input type="password" id="new-password" placeholder="Password">
            <span id="password-requirements-header">Password must be:</span>
            <ul id="password-requirements-list">
                <li id="length">At least <i><b>12</b></i>  characters</li>
                <li id="upper">At least <i><b>one</b></i> uppercase letter</li>
                <li id="lower">At least <i><b>one</b></i> lowercase letter</li>
                <li id="number">At least <i><b>one</b></i> number</li>
                <li id="special">At least <i><b>one</b></i> special character</li>
            </ul>
            <input type="password" placeholder="Confirm Password" id='confirmed-password' required>
            
            <!-- Get provider ID from patient attempting to create an account -->
            <div id="provider-id-field">
                <input id="provider-id" placeholder="Provider ID" name="message">
            </div>

            <!-- Error message displayed on reload if create account failed -->
            <span id="message" style="display: none"></span>
            <button type="submit" id="create-account-btn">Create Account</button>
            
            <!-- Link to log in page -->
            <h3>Already have an account?</h3>
            </form>
            <a type="button" href="/login" id="create-account">
                <button>Log In</button>
            </a>
        </div>
        <script src="index.js"></script>
    </body>
</html>
