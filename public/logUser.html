<!-- Log in page -->
<!DOCTYPE html>
<html>
    <head>
        <title>Log In</title>
        <link rel="stylesheet" href="index.css">
        <link rel="fav icon" type="image/x-icon" href="image/pill.png">

    </head>
    <div id="logo-container">
        <img src="image/remindrx_logo.svg" alt="RemindRx Logo" id="brand-logo">
    </div>
    <body id="login">
        <h1>Log <b>In</b></h1>
        <!-- Log in form -->
        <form class="login" id="login-form">
            <!-- Choose patient or provider radio button -->
            <div>
                <input type="radio" name="choice" value='healthcare-provider' id="healthcare-provider" required> 
                <label class="option" >Healthcare Provider</label>
            </div>
            <div>
                <input type="radio" name="choice" value='patient' id="patient"> 
                <label class="option" >Patient</label>
            </div>

            <!-- Get email and password from user -->
            <input type="email" placeholder="Enter email" id="email" required>
            <input type="password" placeholder="Enter password" id="password" required>
                        
            <!-- Error message displayed on reload if login failed -->
            <span id="message" style="display: none"></span>
            
            <!-- Press login button to attempt login -->
            <button type="submit">Log In</button>

            <!-- Link to create account page -->
            <h3>Don't have an account?</h3>
            </form>
            <a href="/create_account" id="sign-up">
                <button type="button">Create Account</button>
            </a>
    </body>
    <script src="index.js"></script>
</html>
