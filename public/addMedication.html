<!-- addMed -->

<!DOCTYPE html>
<html>
    <head>
        <title>Add Medication</title>
        <link rel="stylesheet" href="index.css">
        <link rel="fav icon" type="image/x-icon" href="image/pill.png">
    </head>

    <div id="logo-container">
        <img src="image/remindrx_logo.svg" alt="RemindRx Logo" id="brand-logo">
    </div>

    <body class="addMed" id="add-med-form">
        
        <h1>Add <B>Medication</B></h1>
        <!-- Add Medicine form -->
        <form class="addMed">
            <!-- Fill out medication specifications -->
            <div>
                <label id="med-specs">Medication Specifications</label>
            </div>
            <!-- Add Medication Information -->
            <input id="medication-name" placeholder="Medication Name" required>
            <input type="text" id="start-date" placeholder="Start Date" onfocus="(this.type='date')" onblur="(this.type='text')" required>
            <input type="number" id="total-pills" placeholder="Total Number of Pills" required>
            <input type="number" id="dose" min="1" max=""placeholder="Dose" required>
            <input type="number" min="1" max="24" id="frequency" placeholder="Frequency (hours)" required>
            <textarea class="auto-expand" id="side-effects" type='text' placeholder="Side Effects"></textarea>
            <textarea id="additional-notes" type='text' placeholder="Additional Notes"></textarea>
        
            <!-- Add Patient Information -->
            <label>Patient Information</label>
            <input id="patient-first-name" placeholder="Patient First Name" required>
            <input id="patient-last-name" placeholder="Patient Last Name" required>
            <input id="patient-id" placeholder="Patient ID" required>
            <!-- Error message displayed on reload if the form failed -->
            <span id="message" style="display: none"></span>
            <button type="submit" id="add-medication-btn">Add Medication</button>
        </form>
        <script src="addMedication.js"></script>
    </body>
</html>
